# WebRTC配置（由 WebRTCConfig.java @ConfigurationProperties(prefix="webrtc") 读取）
webrtc:
  ice-servers:
    - urls: stun:stun.l.google.com:19302
    - urls: stun:stun1.l.google.com:19302
  video:
    codec: VP8
    width: 640
    height: 480
    framerate: 15
    bitrate: 500000
    min-bitrate: 100000
    max-bitrate: 1000000
