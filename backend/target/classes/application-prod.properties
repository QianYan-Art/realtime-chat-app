# 生产环境配置

# 服务器配置
server.port=8083
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript

# 数据库配置 - 使用H2文件数据库（生产环境应替换为MySQL等）
spring.datasource.url=${DEVBOX_DB_URL:jdbc:h2:file:../data/chatapp};DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DEVBOX_DB_USERNAME:sa}
spring.datasource.password=${DEVBOX_DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# H2控制台 - 生产环境禁用
spring.h2.console.enabled=false

# 日志配置
logging.level.root=INFO
logging.level.com.chatapp=INFO
logging.file.name=./logs/application-prod.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# WebSocket配置
spring.websocket.path=/ws

# 安全配置（由 SecurityConfig 控制，此处仅作环境变量映射）
spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD}

# CORS配置
app.cors.allowed-origins=${ALLOWED_ORIGINS:*}

# JWT配置 - 生产环境必须通过环境变量 JWT_SECRET 设置，无默认值
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000  # Token有效期24小时
app.jwt.header=Authorization
app.jwt.prefix=Bearer

# 文件上传配置
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Actuator配置
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.db.enabled=true
management.health.diskspace.enabled=true
