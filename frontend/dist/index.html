<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>实时聊天应用</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="styles/main.css" rel="stylesheet">
    <!-- 确保SockJS和Stomp库正确加载 -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
  </head>
  <body>
    <div id="app" class="container-fluid p-0">
        <!-- 登录页面 -->
        <div id="loginPage" class="page">
            <div class="login-container">
                <div class="login-header">
                    <h2>实时聊天应用</h2>
                    <p>请登录以开始聊天</p>
                </div>
                <form id="loginForm" class="login-form">
                    <div class="form-group">
                        <label for="username">用户名</label>
                        <input type="text" id="username" class="form-control" placeholder="请输入用户名" required>
                    </div>
                    <div class="form-group">
                        <label for="password">密码</label>
                        <input type="password" id="password" class="form-control" placeholder="请输入密码" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">登录</button>
                </form>
            </div>
        </div>

        <!-- 聊天页面 -->
        <div id="chatPage" class="page" style="display: none;">
            <div class="chat-container">
                <!-- 侧边栏 -->
                <div class="sidebar">
                    <div class="user-profile">
                        <div class="user-avatar">
                            <i class="fas fa-user"></i>
                        </div>
                        <div class="user-info">
                            <h3 id="currentUserName">用户名</h3>
                            <span class="status online">在线</span>
                        </div>
                    </div>
                    
                    <div class="user-actions">
                        <button id="startVideoButton" class="btn btn-primary">
                            <i class="fas fa-video"></i> 开始视频
                        </button>
                        <button id="logoutButton" class="btn btn-outline-danger">
                            <i class="fas fa-sign-out-alt"></i> 登出
                        </button>
                    </div>
                    
                    <div class="users-section">
                        <h4>在线用户</h4>
                        <div id="userList" class="user-list">
                            <!-- 用户列表将在这里动态生成 -->
                        </div>
                    </div>
                </div>
                
                <!-- 聊天区域 -->
                <div class="chat-area">
                    <div class="chat-header">
                        <h3>聊天室</h3>
                    </div>
                    
                    <div id="chatMessages" class="chat-messages">
                        <!-- 消息将在这里动态生成 -->
                    </div>
                    
                    <div class="chat-input">
                        <input type="text" id="messageInput" class="form-control" placeholder="输入消息...">
                        <button id="sendButton" class="btn btn-primary">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 视频通话页面 -->
        <div id="videoPage" class="page" style="display: none;">
            <div class="video-container">
                <div class="video-header">
                    <h3>视频通话</h3>
                    <button id="backToChatButton" class="btn btn-outline-secondary">
                        <i class="fas fa-arrow-left"></i> 返回聊天
                    </button>
                </div>
                
                <div class="video-area">
                    <div class="video-main">
                        <video id="remoteVideo" autoplay playsinline></video>
                    </div>
                    <div class="video-self">
                        <video id="localVideo" autoplay playsinline muted></video>
                    </div>
                </div>
                
                <div class="video-controls">
                    <button id="toggleAudioButton" class="btn btn-control" disabled>
                        <i class="fas fa-microphone"></i>
                    </button>
                    <button id="toggleVideoButton" class="btn btn-control" disabled>
                        <i class="fas fa-video"></i>
                    </button>
                    <button id="hangupButton" class="btn btn-control btn-danger" disabled>
                        <i class="fas fa-phone-slash"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 脚本引用 -->
    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="websocket.js"></script>
    <script src="webrtc.js"></script>
    <script src="app.js"></script>
  </body>
</html>
