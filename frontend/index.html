<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>实时聊天应用</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="styles/main.css" rel="stylesheet">
    <!-- 确保SockJS和Stomp库正确加载 -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
  </head>
  <body>
    <div id="app" class="container-fluid p-0">
        <!-- 登录页面 -->
        <div id="loginPage" class="page">
            <div class="login-container">
                <div class="login-header">
                    <h2>实时聊天应用</h2>
                    <p>请登录以开始聊天</p>
                </div>
                <div class="login-form">
                    <div class="form-group">
                        <label for="username">用户名</label>
                        <input type="text" id="username" class="form-control" placeholder="请输入用户名" required>
                    </div>
                    <div class="form-group">
                        <label for="password">密码</label>
                        <input type="password" id="password" class="form-control" placeholder="请输入密码">
                    </div>
                    <button type="button" id="loginButton" class="btn btn-primary btn-block">登录</button>
                    
                    <!-- 添加用户凭据管理按钮 -->
                    <div class="mt-3">
                        <button type="button" id="manageUsersButton" class="btn btn-outline-secondary btn-sm">
                            <i class="fas fa-cog"></i> 管理用户凭据
                        </button>
                    </div>
                    
                    <!-- 登录错误提示 -->
                    <div id="loginError" class="alert alert-danger mt-3" style="display: none;"></div>
                </div>
            </div>
        </div>

        <!-- 用户凭据管理模态框 -->
        <div class="modal fade" id="userManagementModal" tabindex="-1" aria-labelledby="userManagementModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="userManagementModalLabel">用户显示名称管理</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
                    </div>
                    <div class="modal-body">
                        <!-- 用户1设置 -->
                        <div class="card mb-3">
                            <div class="card-header">
                                <h6>用户1 (管理员)</h6>
                            </div>
                            <div class="card-body">
                                <div class="mb-2">
                                    <label for="user1Username" class="form-label">用户名</label>
                                    <input type="text" class="form-control" id="user1Username">
                                </div>
                                <div class="mb-2">
                                    <label for="user1DisplayName" class="form-label">显示名称</label>
                                    <input type="text" class="form-control" id="user1DisplayName">
                                </div>
                                <button type="button" class="btn btn-primary btn-sm" id="saveUser1Button">保存</button>
                            </div>
                        </div>
                        
                        <!-- 用户2设置 -->
                        <div class="card">
                            <div class="card-header">
                                <h6>用户2 (访客)</h6>
                            </div>
                            <div class="card-body">
                                <div class="mb-2">
                                    <label for="user2Username" class="form-label">用户名</label>
                                    <input type="text" class="form-control" id="user2Username">
                                </div>
                                <div class="mb-2">
                                    <label for="user2DisplayName" class="form-label">显示名称</label>
                                    <input type="text" class="form-control" id="user2DisplayName">
                                </div>
                                <button type="button" class="btn btn-primary btn-sm" id="saveUser2Button">保存</button>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 聊天页面 -->
        <div id="chatPage" class="page" style="display: none;">
            <div class="chat-container">
                <!-- 侧边栏 -->
                <div class="sidebar">
                    <div class="user-profile">
                        <div class="user-avatar">
                            <i class="fas fa-user"></i>
                        </div>
                        <div class="user-info">
                            <h3 id="currentUserName">用户名</h3>
                            <span class="status online">在线</span>
                        </div>
                    </div>
                    
                    <div class="user-actions">
                        <button id="startVideoButton" class="btn btn-primary">
                            <i class="fas fa-video"></i> 开始视频
                        </button>
                        <button id="logoutButton" class="btn btn-outline-danger">
                            <i class="fas fa-sign-out-alt"></i> 登出
                        </button>
                    </div>
                    
                    <div class="users-section">
                        <h4>在线用户</h4>
                        <div id="userList" class="user-list">
                            <!-- 用户列表将在这里动态生成 -->
                        </div>
                    </div>
                </div>
                
                <!-- 聊天区域 -->
                <div class="chat-area">
                    <div class="chat-header">
                        <h3>聊天室</h3>
                    </div>
                    
                    <div id="chatMessages" class="chat-messages">
                        <!-- 消息将在这里动态生成 -->
                    </div>
                    
                    <div class="chat-input">
                        <input type="text" id="messageInput" class="form-control" placeholder="输入消息...">
                        <button id="sendButton" class="btn btn-primary">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 视频通话浮动窗口 -->
        <div class="video-container resizable" style="display: none;">
            <div class="video-header">
                <h3>视频通话</h3>
                <div class="video-controls-header">
                    <button id="minimizeVideoButton" class="btn btn-sm btn-outline-secondary">
                        <i class="fas fa-compress-alt"></i>
                    </button>
                    <button id="backToChatButton" class="btn btn-sm btn-outline-secondary">
                        <i class="fas fa-arrow-left"></i> 返回聊天
                    </button>
                </div>
            </div>
            
            <div class="video-area">
                <div class="video-main">
                    <video id="remoteVideo" autoplay playsinline></video>
                </div>
                <div class="video-self">
                    <video id="localVideo" autoplay playsinline muted></video>
                </div>
            </div>
            
            <div class="video-controls-footer">
                <button id="toggleAudioButton" class="btn btn-control" disabled>
                    <i class="fas fa-microphone"></i>
                </button>
                <button id="toggleVideoButton" class="btn btn-control" disabled>
                    <i class="fas fa-video"></i>
                </button>
                <button id="hangupButton" class="btn btn-control btn-danger" disabled>
                    <i class="fas fa-phone-slash"></i>
                </button>
            </div>
        </div>
        
        <!-- 最小化后的视频控制栏 -->
        <div id="minimizedVideoBar" class="minimized-video-bar" style="display: none;">
            <div class="minimized-video-content">
                <div class="minimized-video-title">视频通话中</div>
                <div class="minimized-video-controls">
                    <button id="expandVideoButton" class="btn btn-sm btn-outline-light">
                        <i class="fas fa-expand-alt"></i>
                    </button>
                    <button id="minimizedToggleAudioButton" class="btn btn-sm btn-outline-light">
                        <i class="fas fa-microphone"></i>
                    </button>
                    <button id="minimizedToggleVideoButton" class="btn btn-sm btn-outline-light">
                        <i class="fas fa-video"></i>
                    </button>
                    <button id="minimizedHangupButton" class="btn btn-sm btn-danger">
                        <i class="fas fa-phone-slash"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- 脚本引用 -->
    <script src="js/config.js"></script>
    <script src="js/users.js"></script>
    <script src="js/api.js"></script>
    <script src="js/websocket.js"></script>
    <script src="js/webrtc.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
